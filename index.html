<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phulo Jhano Billing System</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#176b3a;
  color:white;
  padding:18px 12px;
  text-align:center;
}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;font-size:13px}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}
h2{
  margin-top:0;
  color:#176b3a;
  font-size:20px;
}
input,select,button{
  width:100%;
  padding:11px;
  margin:5px 0;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}
button{
  border:0;
  background:#176b3a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9}
.red{background:#c62828}
.blue{background:#1565c0}
.orange{background:#ef6c00}
.gray{background:#555}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  background:white;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{
  background:#176b3a;
  color:white;
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.box{
  background:#eef8f1;
  padding:15px;
  border-radius:10px;
  text-align:center;
}
.box b{
  display:block;
  font-size:22px;
  color:#176b3a;
  margin-top:5px;
}

.invoice{
  border:2px solid #176b3a;
  padding:15px;
  margin-top:15px;
}
.invoice-head{
  text-align:center;
  border-bottom:2px solid #176b3a;
  padding-bottom:10px;
}
.invoice-head h2{margin:0}
.total{
  text-align:right;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

@media print{
  body{background:white}
  header,.no-print,.card:not(.print-card){
    display:none!important;
  }
  .print-card{
    display:block!important;
    box-shadow:none;
  }
  .invoice{border:0}
}
</style>
</head>

<body>

<header>
  <h1>🌿 Phulo Jhano Pvt. Ltd.</h1>
  <p>Direct Selling • Billing & Commission System</p>
</header>

<div class="container">

<!-- CUSTOMER -->
<div class="card no-print">
<h2>👤 Customer Information</h2>

<div class="grid">
<div>
<label>Customer Name</label>
<input id="customerName" placeholder="গ্রাহকের নাম">
</div>

<div>
<label>Mobile Number</label>
<input id="customerMobile" placeholder="মোবাইল নম্বর">
</div>

<div>
<label>Member ID</label>
<input id="memberId" placeholder="Member ID">
</div>

<div>
<label>Sales Person</label>
<input id="salesPerson" placeholder="সেলস পার্সনের নাম">
</div>
</div>
</div>


<!-- PRODUCT -->
<div class="card no-print">
<h2>🛒 Add Product</h2>

<div class="grid">

<div>
<label>Product Name</label>
<input id="productName" placeholder="যেমন: Phulo Jhano Soap">
</div>

<div>
<label>Price (₹)</label>
<input id="productPrice" type="number" placeholder="100">
</div>

<div>
<label>Quantity</label>
<input id="productQty" type="number" value="1" min="1">
</div>

</div>

<button onclick="addProduct()">➕ Add Product</button>
</div>


<!-- BILL -->
<div class="card print-card">

<div class="invoice">

<div class="invoice-head">
<h2>Phulo Jhano Pvt. Ltd.</h2>
<p>DIRECT SELLING BILL / INVOICE</p>
<p id="invoiceNumber"></p>
<p id="invoiceDate"></p>
</div>

<br>

<div>
<b>Customer:</b> <span id="showCustomer">-</span><br>
<b>Mobile:</b> <span id="showMobile">-</span><br>
<b>Member ID:</b> <span id="showMember">-</span><br>
<b>Sales Person:</b> <span id="showSales">-</span>
</div>

<table>
<thead>
<tr>
<th>SL</th>
<th>Product</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
<th class="no-print">Action</th>
</tr>
</thead>

<tbody id="billItems"></tbody>
</table>

<div class="total
